name: Auto Unzip
on:
  push:
    paths:
      - '**.zip'
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and clean up zip
        run: |
          unzip -o "*.zip"
          rm -f *.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extracted project files"
          git push
          
